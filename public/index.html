<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>智能任务管理系统</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 40px 20px; }
    .container { max-width: 640px; margin: 0 auto; background: #fff; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); padding: 32px; }
    h1 { text-align: center; color: #333; margin-bottom: 24px; font-size: 28px; }
    .input-row { display: flex; gap: 8px; margin-bottom: 16px; }
    .input-row input { flex: 1; padding: 12px 16px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 15px; outline: none; }
    .input-row input:focus { border-color: #667eea; }
    .input-row select { padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 15px; outline: none; cursor: pointer; }
    .input-row button { padding: 12px 24px; background: #667eea; color: #fff; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; }
    .filter-bar { display: flex; gap: 8px; margin-bottom: 20px; }
    .filter-bar button { padding: 6px 16px; border: 1px solid #ddd; background: #fff; border-radius: 20px; cursor: pointer; font-size: 14px; }
    .filter-bar button.active { background: #667eea; color: #fff; border-color: #667eea; }
    .task-list { list-style: none; }
    .task-item { display: flex; align-items: center; padding: 14px 16px; border-bottom: 1px solid #f0f0f0; gap: 12px; }
    .task-item:last-child { border-bottom: none; }
    .task-title { flex: 1; font-size: 15px; color: #333; }
    .task-title.completed { text-decoration: line-through; color: #aaa; }
    .badge { padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 500; }
    .badge-高 { background: #ffe0e0; color: #d32f2f; }
    .badge-中 { background: #fff3e0; color: #f57c00; }
    .badge-低 { background: #e8f5e9; color: #388e3c; }
    .task-actions { display: flex; gap: 6px; }
    .task-actions button { padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; }
    .btn-toggle { background: #e3f2fd; color: #1976d2; }
    .btn-delete { background: #ffebee; color: #c62828; }
    .empty { text-align: center; color: #999; padding: 40px 0; font-size: 15px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;
    function App() {
      const [tasks, setTasks] = useState([]);
      const [title, setTitle] = useState('');
      const [priority, setPriority] = useState('中');
      const [filter, setFilter] = useState('全部');
      const [loading, setLoading] = useState(false);
      const fetchTasks = async () => {
        setLoading(true);
        const res = await fetch('/api/tasks' + (filter !== '全部' ? '?priority=' + filter : ''));
        const data = await res.json();
        setTasks(data);
        setLoading(false);
      };
      useEffect(() => { fetchTasks(); }, [filter]);
      const addTask = async () => {
        if (!title.trim()) return;
        await fetch('/api/tasks', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title, priority }) });
        setTitle('');
        fetchTasks();
      };
      const toggleTask = async (id) => { await fetch('/api/tasks/' + id + '/toggle', { method: 'PUT' }); fetchTasks(); };
      const deleteTask = async (id) => { await fetch('/api/tasks/' + id, { method: 'DELETE' }); fetchTasks(); };
      return (
        <div className="container">
          <h1>📋 智能任务管理系统</h1>
          <div className="input-row">
            <input type="text" placeholder="输入任务标题..." value={title} onChange={e => setTitle(e.target.value)} onKeyDown={e => e.key === 'Enter' && addTask()} />
            <select value={priority} onChange={e => setPriority(e.target.value)}>
              <option value="高">高</option><option value="中">中</option><option value="低">低</option>
            </select>
            <button onClick={addTask}>添加</button>
          </div>
          <div className="filter-bar">
            {['全部', '高', '中', '低'].map(f => (
              <button key={f} className={filter === f ? 'active' : ''} onClick={() => setFilter(f)}>{f}</button>
            ))}
          </div>
          {loading ? (<div className="empty">加载中...</div>) : tasks.length === 0 ? (<div className="empty">暂无任务，添加一条吧 🎉</div>) : (
            <ul className="task-list">
              {tasks.map(t => (
                <li key={t.id} className="task-item">
                  <span className={'task-title ' + (t.completed ? 'completed' : '')}>{t.title}</span>
                  <span className={'badge badge-' + t.priority}>{t.priority}</span>
                  <div className="task-actions">
                    <button className="btn-toggle" onClick={() => toggleTask(t.id)}>{t.completed ? '撤销' : '完成'}</button>
                    <button className="btn-delete" onClick={() => deleteTask(t.id)}>删除</button>
                  </div>
                </li>
              ))}
            </ul>
          )}
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
